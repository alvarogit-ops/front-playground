<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
        <div class="min-h-screen bg-indigo-950 flex items-center justify-between px-50">
             <div class="max-w-sm rounded overflow-hidden shadow-lg">
            <p class="text-white">Gerador de senhas</p>
            <h1 class="mb-3 text-3xl text-white font-bold tracking-tight text-heading md:text-3xl lg:text-3xl">Senhas aleatórias fortes</h1>
        </div>
        
    
    <div class="bg-white rounded-lg p-8 w-96">
         <h3>Opções</h3>
    <label for="tamanho">Largura: <span id="valor-tamanho">14</span></label>
    <div><input type="range" name="tamanho" id="tamanho" min="8" max="32" value="14"></div>
    <h3>Incluir</h3>
    <div><input type="checkbox" name="maiusculas" id="maiusculas"> A - Z</div>
    <div><input type="checkbox" name="minusculas" id="minusculas"> a - z</div>
     <div><input type="checkbox" name="numeros" id="numeros">0 - 9</div>
     <div><input type="checkbox" name="simbolos" id="simbolos">%$!@</div>
    <button class="bg-transparent hover:bg-blue-500 text-blue-700 font-semibold hover:text-white py-2 px-4 my-4 border border-blue-500 hover:border-transparent rounded">
  Gerar senha
  </button>
<div id="div-resultado" class="bg-gray-100 text-gray-600 px-4 py-2 rounded-lg hidden">
    <span id="senha"></span>
     <button id="copiar" class="hidden">
            <i class="fa-solid fa-copy"></i>
        <button>
        </div>
       
    </div>    
    </div>
</div>
</div>
        
    
    

        
    <script src="script.js"></script>         
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</body>
</html>
